<!DOCTYPE html>
<html>
<head>
    <title>Surface of Revolution with AR</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/jeromeetienne/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; }
        #info { position: absolute; top: 10px; left: 10px; color: white; }
    </style>
    <!-- Optional: Add a dummy favicon to avoid 404 -->
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
</head>
<body>
    <!-- Shader Sources -->
    <script>
        const vertexShaderSource = `attribute vec3 vertex;
uniform mat4 modelViewMatrix;
uniform mat4 projectionMatrix;

void main() {
    gl_Position = projectionMatrix * modelViewMatrix * vec4(vertex, 1.0);
}`;

        const fragmentShaderSource = `#ifdef GL_FRAGMENT_PRECISION_HIGH
   precision highp float;
#else
   precision mediump float;
#endif

uniform vec4 color;
void main() {
    gl_FragColor = color;
}`;
    </script>

    <!-- Component Definition -->
    <script src="js/Model.js"></script>
    <script src="js/main.js"></script>
    <script src="js/StereoCamera.js"></script>
    <script src="js/Texture.js"></script>
    <script src="js/trackball-rotator.js"></script>
    <script src="js/m4.js"></script>
    <script>
        AFRAME.registerComponent('custom-surface', {
            init: function () {
                const marker = this.el;
                if (typeof CreateSurfaceData === 'undefined') {
                    console.error('CreateSurfaceData is not defined. Check Model.js loading.');
                    return;
                }
                const data = {};
                CreateSurfaceData(data);

                // Create a custom geometry based on your surface data
                const geometry = new THREE.BufferGeometry();
                geometry.setIndex(new THREE.BufferAttribute(data.indicesU16, 1));
                geometry.setAttribute('position', new THREE.BufferAttribute(data.verticesF32, 3));
                geometry.computeVertexNormals();

                // Define the custom material with your shaders
                const customMaterial = new THREE.ShaderMaterial({
                    vertexShader: vertexShaderSource,
                    fragmentShader: fragmentShaderSource,
                    uniforms: {
                        color: { value: new THREE.Vector4(0.5, 0.5, 0.5, 1) }
                    }
                });

                const mesh = new THREE.Mesh(geometry, customMaterial);

                // Scale and position the mesh appropriately
                mesh.scale.set(0.3, 0.3, 0.3); // Adjust scale to fit marker
                mesh.position.set(0, 0, 0); // Centered on marker

                marker.object3D.add(mesh);
            }
        });
    </script>

    <!-- Scene -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;">
        <a-marker preset="custom" type="pattern" url="pattern-fractal1.patt" custom-surface>
            <!-- Optional: Remove or adjust the box entity if not needed -->
            <!-- <a-entity geometry="primitive: box; width: 0.5; height: 0.5; depth: 0.5" material="color: red"></a-entity> -->
        </a-marker>
        <a-entity camera></a-entity>
    </a-scene>
    <div id="info">Point your camera at the printed pattern.</div>
</body>
</html>
