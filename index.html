<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Control Task</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>

<script src="https://unpkg.com/three@0.127.0/build/three.min.js"></script>
<script src="https://raw.githack.com/jeromeetienne/AR.js/1.7.2/three.js/build/ar.js"></script>
<script src="Model.js"></script>

<script>
    const renderer = new THREE.WebGLRenderer({alpha: true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.Camera();
    scene.add(camera);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
    directionalLight.position.set(0, 1, 1);
    scene.add(ambientLight, directionalLight);

    const arToolkitSource = new THREEx.ArToolkitSource({sourceType: 'webcam'});
    arToolkitSource.init(() => setTimeout(onResize, 1000));
    window.addEventListener('resize', onResize);

    function onResize() {
        arToolkitSource.onResizeElement();
        arToolkitSource.copyElementSizeTo(renderer.domElement);
        if (arToolkitContext.arController) {
            arToolkitSource.copyElementSizeTo(arToolkitContext.arController.canvas);
        }
    }

    const arToolkitContext = new THREEx.ArToolkitContext({
        cameraParametersUrl: 'https://raw.githack.com/jeromeetienne/AR.js/1.7.2/data/data/camera_para.dat',
        detectionMode: 'mono',
    });

    arToolkitContext.init(() => {
        camera.projectionMatrix.copy(arToolkitContext.getProjectionMatrix());
    });

    const markerRoot = new THREE.Group();
    scene.add(markerRoot);

    new THREEx.ArMarkerControls(arToolkitContext, markerRoot, {
        type: 'pattern',
        patternUrl: 'pattern-hevlich.patt',
    });

    scene.visible = false;

    const surfaceData = {};
    CreateSurfaceData(surfaceData);

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.BufferAttribute(surfaceData.verticesF32, 3));
    geometry.setAttribute('normal', new THREE.BufferAttribute(surfaceData.normalsF32, 3));
    geometry.setIndex(new THREE.BufferAttribute(surfaceData.indicesU16, 1));
    geometry.computeVertexNormals();

    const material = new THREE.ShaderMaterial({
        vertexShader: `
            varying vec3 vPosition;
            void main() {
                vPosition = position;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `,
        fragmentShader: `
            varying vec3 vPosition;
            void main() {
                float t = (vPosition.y + 0.5) / 1.0;
                vec3 color1 = vec3(0.18, 0.49, 0.20);
                vec3 color2 = vec3(0.65, 0.84, 0.65);
                vec3 color = mix(color1, color2, t);
                gl_FragColor = vec4(color, 1.0);
            }
        `,
        side: THREE.DoubleSide
    });

    const mesh = new THREE.Mesh(geometry, material);
    mesh.scale.set(0.3, 0.3, 0.3);
    mesh.position.y = 0;
    markerRoot.add(mesh);

    const onRenderFcts = [
        (delta, now) => {
            if (!arToolkitSource.ready) return;
            arToolkitContext.update(arToolkitSource.domElement);
            scene.visible = camera.visible;
        },
        (delta, now) => {
            renderer.render(scene, camera);
        }
    ];

    let lastTimeMsec = null;

    function animate(nowMsec) {
        requestAnimationFrame(animate);
        lastTimeMsec = lastTimeMsec || nowMsec - 1000 / 60;
        const deltaMsec = Math.min(200, nowMsec - lastTimeMsec);
        lastTimeMsec = nowMsec;
        onRenderFcts.forEach(fn => fn(deltaMsec / 1000, nowMsec / 1000));
    }

    requestAnimationFrame(animate);
</script>

</body>
</html>
